<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal VIP - Portugal Mode</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:url('Thumb.png') center center/cover no-repeat fixed;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:460px;

    background:rgba(0,0,0,0.78);

    border-radius:25px;

    padding:40px;

    text-align:center;

    backdrop-filter:blur(6px);

    box-shadow:0 0 30px rgba(177,89,255,0.6);

}

.logo{

    width:90px;

    margin-bottom:20px;

    filter:drop-shadow(0 0 12px rgba(255,255,255,0.6));

}

h1{

    color:white;

    margin-bottom:10px;

    font-size:28px;

}

.subtitulo{

    color:white;

    font-size:15px;

    margin-bottom:25px;

}

input{

    width:100%;

    padding:16px;

    border:none;

    border-radius:12px;

    margin-bottom:15px;

    font-size:16px;

}

button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:18px;

    font-weight:bold;

    background:linear-gradient(
        90deg,
        #ff3c3c,
        #ff9900,
        #ffee00,
        #56ff56,
        #00d9ff,
        #b15fff,
        #ff00ff
    );

    transition:0.3s;

}

button:hover{

    transform:scale(1.03);

    box-shadow:0 0 25px rgba(255,255,255,0.4);

}

.info{

    color:white;

    margin-top:20px;

    font-size:14px;

}

#erro{

    margin-top:15px;

    color:#ff5555;

    font-weight:bold;

}

</style>
</head>

<body>

<div class="container">

    <img src="Brasão 1.png" class="logo">

    <h1>PORTAL VIP</h1>

    <p class="subtitulo">
        Conteúdo Exclusivo para Membros do Portugal Mode
    </p>

    <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
    >

    <button onclick="verificarSenha()">
        ACESSAR
    </button>

    <div id="erro"></div>

    <p class="info">
        A senha é disponibilizada mensalmente para membros do canal.
    </p>

</div>

<script>

function verificarSenha(){

    let senha = document.getElementById("senha").value;

    if(senha === "PORTUGALMODE2026"){

        document.getElementById("erro").style.color="#00ff88";

        document.getElementById("erro").innerHTML="Acesso liberado...";

        setTimeout(function(){

            window.location.href="portal.html";

        },1000);

    }

    else{

        document.getElementById("erro").style.color="#ff5555";

        document.getElementById("erro").innerHTML="Senha incorreta";

    }

}

document.getElementById("senha").addEventListener("keypress", function(event){

    if(event.key === "Enter"){

        verificarSenha();

    }

});

</script>

</body>
</html>
