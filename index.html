<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal VIP Portugal Mode</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{

background:url("Wallpaper Engine.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;
}

body::before{

content:"";

position:absolute;
inset:0;

background:rgba(0,0,0,0.75);

backdrop-filter:blur(4px);

}

.container{

position:relative;
z-index:2;

width:90%;
max-width:500px;

text-align:center;

padding:40px;

border-radius:25px;

background:rgba(0,0,0,0.65);

border:1px solid rgba(255,255,255,0.15);

box-shadow:
0 0 30px rgba(255,0,255,.25),
0 0 60px rgba(0,255,255,.15);

}

.logo{

width:220px;

margin-bottom:20px;

filter:drop-shadow(0 0 15px rgba(255,255,255,.3));

}

h1{

color:white;

font-size:42px;

margin-bottom:10px;

}

.subtitle{

color:#d8d8d8;

margin-bottom:30px;

font-size:16px;

}

input{

width:100%;

padding:16px;

border:none;

border-radius:12px;

font-size:16px;

margin-bottom:15px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

background:linear-gradient(
90deg,
#ff3b3b,
#ff8800,
#ffff00,
#00ff66,
#00ffff,
#0077ff,
#ff00ff
);

color:black;

transition:.3s;

}

button:hover{

transform:scale(1.03);

}

.info{

margin-top:20px;

font-size:13px;

color:#bbbbbb;

}

</style>

</head>

<body>

<div class="container">

<img src="Brasão 1.png" class="logo">

<h1>PORTAL VIP</h1>

<p class="subtitle">
Conteúdo Exclusivo para Membros do Portugal Mode
</p>

<input type="password" placeholder="Digite sua senha">

<button>ACESSAR</button>

<p class="info">
A senha é disponibilizada mensalmente para membros do canal.
</p>

</div>

</body>
</html>
