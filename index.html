<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal VIP - Portugal Mode</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;

    background:
    linear-gradient(rgba(0,0,0,0.60), rgba(0,0,0,0.60)),
    url('Thumb.png');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.container{
    width:500px;
    padding:40px;

    text-align:center;

    background:rgba(0,0,0,0.75);

    border-radius:25px;

    box-shadow:
    0 0 20px rgba(255,255,255,0.15),
    0 0 40px rgba(255,0,255,0.20);
}

.logo{
    width:220px;
    margin-bottom:15px;
}

h1{
    color:white;
    font-size:28px;
    margin-bottom:10px;
}

.subtitulo{
    color:#dcdcdc;
    margin-bottom:25px;
    font-size:18px;
}

input{
    width:100%;
    padding:15px;

    border:none;
    border-radius:12px;

    font-size:16px;

    margin-bottom:15px;
}

button{
    width:100%;
    padding:16px;

    border:none;
    border-radius:12px;

    cursor:pointer;

    font-size:20px;
    font-weight:bold;

    color:black;

    background:linear-gradient(
    90deg,
    #ff4040,
    #ffd500,
    #00ff80,
    #00cfff,
    #ff00ff
    );
}

button:hover{
    transform:scale(1.02);
}

.erro{
    margin-top:15px;
    color:#ff5a5a;
    font-weight:bold;
}

.aviso{
    color:#dcdcdc;
    margin-top:20px;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<img src="Brasão 1.png" class="logo">

<h1>PORTAL VIP</h1>

<p class="subtitulo">
Conteúdo Exclusivo para Membros do Portugal Mode
</p>

<input
type="password"
id="senha"
placeholder="Digite sua senha">

<button onclick="verificarSenha()">
ACESSAR
</button>

<div id="erro" class="erro"></div>

<p class="aviso">
A senha é disponibilizada mensalmente para membros do canal.
</p>

</div>

<script>

function verificarSenha(){

let senha =
document.getElementById("senha").value;

if(senha === "PORTUGALMODE2026"){

window.location.href = "portal.html";

}else{

document.getElementById("erro").innerHTML =
"Senha incorreta.";

}

}

</script>

</body>
</html>
