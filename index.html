<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal VIP - Portugal Mode</title>

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;

    background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url('Thumb.png');

    background-size:cover;
    background-position:center;
}

.container{
    width:420px;
    padding:35px;
    text-align:center;

    background:rgba(0,0,0,0.75);

    border-radius:25px;

    box-shadow:
    0 0 25px rgba(255,255,255,0.15),
    0 0 40px rgba(255,0,255,0.15);
}

.logo{
    width:90px;
    margin-bottom:15px;
}

h1{
    color:white;
    margin:0;
    font-size:28px;
}

.subtitulo{
    color:#d8d8d8;
    margin-top:10px;
    margin-bottom:25px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    border:none;
    border-radius:12px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(
    90deg,
    #ff3c3c,
    #ffd500,
    #00ffb7,
    #00bfff,
    #ff00ff);

    color:black;
}

button:hover{
    transform:scale(1.02);
}

.aviso{
    color:#cfcfcf;
    margin-top:18px;
    font-size:14px;
}

.erro{
    color:#ff4d4d;
    margin-top:12px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<img src="Brasão 1.png" class="logo">

<h1>PORTAL VIP</h1>

<p class="subtitulo">
Conteúdo Exclusivo para Membros do Portugal Mode
</p>

<input
type="password"
id="senha"
placeholder="Digite sua senha">

<button onclick="verificarSenha()">
ACESSAR
</button>

<div id="erro" class="erro"></div>

<p class="aviso">
A senha é disponibilizada mensalmente para membros do canal.
</p>

</div>

<script>

function verificarSenha(){

let senha =
document.getElementById("senha").value;

if(senha === "PORTUGALMODE2026"){

window.location.href =
"portal.html";

}else{

document.getElementById("erro").innerHTML =
"Senha incorreta.";

}

}

</script>

</body>
</html>
